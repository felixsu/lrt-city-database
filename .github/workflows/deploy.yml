name: Build and Deploy (Production Only)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          secrets: |
            database_url=${{ secrets.DATABASE_URL }}
          tags: |
            ghcr.io/felixsu/lrt-city-database:latest
            ghcr.io/felixsu/lrt-city-database:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /app/lixionary-lrtcity
            git reset --hard HEAD
            git clean -fd
            git pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "POSTGRES_USER=lrtcity" > .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_DB=lrtcity" >> .env
            echo "DB_PORT=8531" >> .env
            echo "DATABASE_URL=postgresql://lrtcity:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/lrtcity" >> .env
            echo "DIRECT_URL=postgresql://lrtcity:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/lrtcity" >> .env
            echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
            echo "AUTH_URL=https://lrtcity.lixionary.com" >> .env
            echo "AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}" >> .env
            echo "AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}" >> .env
            echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
            echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env
            echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env
            echo "CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}" >> .env
            echo "APP_PORT=8530" >> .env
            echo "NODE_ENV=production" >> .env
            docker compose -f docker-compose.production.yml pull -q
            docker compose -f docker-compose.production.yml up -d
            docker image prune -f
