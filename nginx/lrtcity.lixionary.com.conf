# Installed on the VPS at /etc/nginx/sites-available/lrtcity.lixionary.com.conf,
# symlinked into sites-enabled/. TLS block below is managed by Certbot
# (`certbot --nginx -d lrtcity.lixionary.com`), matching every other site on this host.
server {
    server_name lrtcity.lixionary.com;

    location / {
        proxy_pass http://127.0.0.1:8530;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lrtcity.lixionary.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lrtcity.lixionary.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = lrtcity.lixionary.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name lrtcity.lixionary.com;
    return 404;
}
