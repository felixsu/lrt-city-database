services:
  postgres:
    image: postgres:17-alpine
    container_name: lrt-city-database-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lrtcity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lrtcity}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lrtcity} -d ${POSTGRES_DB:-lrtcity}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    container_name: lrt-city-database
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8530}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lrtcity}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lrtcity}
      DIRECT_URL: postgresql://${POSTGRES_USER:-lrtcity}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lrtcity}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
